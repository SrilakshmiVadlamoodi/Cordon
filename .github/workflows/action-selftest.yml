name: github-action self-test

# Exercises this repo's own action.yml end-to-end on GitHub's hosted
# runner, both proving the composite action works at all and serving as
# the concrete "Cordon runs on Cordon's own CI" Phase 3 item
# (INTENT.md §4) as a byproduct — the first real, non-local proof of
# whether unprivileged user namespaces are available on ubuntu-latest,
# or the AppArmor gate (INTENT.md §3, DECISIONS.md 2026-09-01) blocks
# them, rather than assuming either way.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulate-no-sudo-fallthrough:
    # Proves the best-effort AppArmor lift in action.yml degrades safely
    # when sudo is unavailable (e.g. a self-hosted runner without it):
    # the wrapped-command failure must still be
    # checkUserNamespacesAvailable's original legible error, not a sudo
    # permission error masking it (DECISIONS.md 2026-09-14 AppArmor
    # entries). Shadows the real `sudo` with one that always fails,
    # ahead of it on PATH, rather than assuming the fallthrough is clean.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shadow sudo with a command that always fails, ahead of the real one on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/sudo" <<'EOF'
          #!/bin/sh
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/fake-bin/sudo"
          echo "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"

      - name: Confirm the fake sudo actually shadows the real one
        shell: bash
        run: |
          if sudo -n true 2>/dev/null; then
            echo "::error::fake sudo shadow did not take effect — this test would prove nothing"
            exit 1
          fi
          echo "fake sudo confirmed in effect: $(command -v sudo)"

      - name: Run Cordon with sudo unavailable
        id: cordon_no_sudo
        continue-on-error: true
        uses: ./
        with:
          run: echo should-not-run-if-userns-still-blocked

      - name: Verify the original legible AppArmor error surfaced, not a sudo error
        shell: bash
        run: |
          if [ "${{ steps.cordon_no_sudo.outcome }}" != "failure" ]; then
            echo "::error::expected the wrapped step to fail (userns should still be blocked with sudo faked out) but it reported outcome=${{ steps.cordon_no_sudo.outcome }} — this test proves nothing if it didn't actually fail"
            exit 1
          fi

          report="$RUNNER_TEMP/cordon-report.txt"
          if [ ! -s "$report" ]; then
            echo "::error::expected a Cordon report file containing the AppArmor error, found none at $report"
            exit 1
          fi

          if ! grep -q "unprivileged user namespaces are restricted by AppArmor" "$report"; then
            echo "::error::expected checkUserNamespacesAvailable's exact error text, got:"
            cat "$report"
            exit 1
          fi

          if grep -qi "sudo" "$report"; then
            echo "::error::the surfaced error mentions sudo — the original legible error is being masked by a sudo-related failure instead of falling through cleanly"
            cat "$report"
            exit 1
          fi

          echo "Confirmed: with sudo unavailable, Cordon still failed with its original legible AppArmor error, not a sudo error."

  benign-command:
    # The simplest possible proof the composite action invokes Cordon
    # correctly end-to-end: no findings expected, step must succeed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          run: echo hello-from-sandboxed-command

  setup-node-path-forwarding:
    # The concrete scenario that motivated features/env-path-forwarding:
    # actions/setup-node installs Node outside every directory Cordon
    # bind-mounted before that feature (typically under
    # /opt/hostedtoolcache), then prepends it to PATH. Before
    # env-path-forwarding, `cordon run npm ...` could not resolve npm/node
    # at all here — this job is the real-runner proof that it now does,
    # not just the local WSL2 dev-machine proof in internal/sandbox's
    # test suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ./
        with:
          run: npm --version

  high-finding-does-not-fail-the-step:
    # Direct proof of features/github-action/intent.md's exit-code policy
    # (INTENT.md §5: "Blocking installs by default. Cordon reports; the
    # human decides."): a command that reads a credential-marker path
    # (triggering behaviorreport's HIGH "Credential file read" rule) but
    # exits 0 on its own must leave this job green. $HOME inside the
    # sandbox is the project directory (DECISIONS.md 2026-09-01), so
    # $HOME/.ssh/id_rsa resolves to a real, sandbox-writable path whose
    # resolved form matches the credentialPathMarkers substring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          run: >-
            mkdir -p "$HOME/.ssh" &&
            echo fake-key-for-selftest > "$HOME/.ssh/id_rsa" &&
            cat "$HOME/.ssh/id_rsa" >/dev/null

      - name: DEBUG - dump GITHUB_STEP_SUMMARY path and content
        shell: bash
        run: |
          echo "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY"
          echo "--- exists? ---"
          ls -la "$GITHUB_STEP_SUMMARY" 2>&1 || echo "MISSING"
          echo "--- content ---"
          cat "$GITHUB_STEP_SUMMARY" 2>&1 || echo "CAT FAILED"
          echo "--- end content ---"

      - name: Verify the HIGH finding actually fired (not a vacuous pass)
        shell: bash
        run: |
          if ! grep -q "Credential file read" "$GITHUB_STEP_SUMMARY"; then
            echo "::error::expected a 'Credential file read' HIGH finding in the step summary, found none — this job passing would otherwise prove nothing about the exit-code policy"
            exit 1
          fi
          echo "HIGH finding was reported above, and the previous step still succeeded — exit-code policy confirmed."
