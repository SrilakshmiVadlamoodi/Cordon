name: 'Cordon'
description: >-
  Run a command (npm install and friends) inside Cordon's rootless Linux
  sandbox and report what it actually did. Never fails the step on a
  finding by itself — Cordon reports, the human decides (INTENT.md §5).
author: 'Srilakshmi Vadlamoodi'

inputs:
  run:
    description: >-
      The shell command to run under Cordon (e.g. "npm ci"). Executed as
      `sh -c '<run>'` inside the sandbox, with the sandbox's own PATH and
      the caller's PATH directories forwarded read-only
      (features/env-path-forwarding).
    required: true

runs:
  using: 'composite'
  steps:
    - name: Check platform
      shell: bash
      run: |
        if [ "${{ runner.os }}" != "Linux" ]; then
          echo "::error::Cordon only supports Linux runners (INTENT.md §3: namespaces and seccomp are Linux-only, permanently). runner.os=${{ runner.os }}"
          exit 1
        fi

    - name: Lift AppArmor unprivileged-userns restriction (best-effort)
      # Ubuntu 24.04+ (the ubuntu-latest default as of DECISIONS.md
      # 2026-09-14) sets kernel.apparmor_restrict_unprivileged_userns=1,
      # which blocks the unprivileged user namespace Cordon's rootless
      # sandbox requires — confirmed on a real hosted runner, not assumed
      # (same entry). This step tries a passwordless-sudo lift, scoped to
      # this one ephemeral job VM. It is deliberately best-effort: if the
      # sysctl is already permissive, or sudo isn't available (e.g. a
      # self-hosted runner without it), this step exits 0 either way and
      # changes nothing — checkUserNamespacesAvailable (run_linux.go)
      # still catches an unlifted restriction below and fails the wrapped
      # step with its own clear, specific error. This step never masks
      # that error with a sudo failure of its own.
      shell: bash
      run: |
        path=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if [ ! -f "$path" ] || [ "$(cat "$path")" != "1" ]; then
          exit 0
        fi
        if sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1; then
          echo "::notice title=Cordon: lifted AppArmor unprivileged-userns restriction::This runner had kernel.apparmor_restrict_unprivileged_userns=1 (Ubuntu 24.04's hardened default), which blocks the unprivileged user namespace Cordon's rootless sandbox needs to run at all (INTENT.md §3 Platform; DECISIONS.md 2026-09-14). Cordon used passwordless sudo to set it to 0. Scope: this is a kernel setting on THIS JOB'S ephemeral runner VM only — it does not persist past this job, does not affect any other job, workflow, or runner, and makes no change to your repository, account, or self-hosted infrastructure beyond this one throwaway machine."
        else
          echo "::notice title=Cordon: could not lift AppArmor unprivileged-userns restriction::kernel.apparmor_restrict_unprivileged_userns=1 on this runner and passwordless sudo for the sysctl write was unavailable or refused, so Cordon left it as found. If the step below fails with 'unprivileged user namespaces are restricted by AppArmor', that is the expected, documented failure (INTENT.md §3 Platform; DECISIONS.md 2026-09-14) — not a bug in Cordon."
        fi

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod

    - name: Build Cordon
      # A separate, distinctly-named step from the one that runs the
      # wrapped command below: if this step fails (a bad pin, a toolchain
      # problem, a build error in Cordon itself), it fails as "Build
      # Cordon" in the workflow's job view, not as the wrapped command's
      # own step — a user must be able to tell "my install failed" from
      # "Cordon itself is broken" at a glance, without reading logs.
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "${{ runner.temp }}/cordon-bin" ./cmd/cordon

    - name: Run wrapped command under Cordon
      shell: bash
      env:
        # Passed via env, not interpolated directly into the script body,
        # so a command containing quotes or shell metacharacters can't
        # break out of the script's own syntax.
        CORDON_RUN_CMD: ${{ inputs.run }}
        CORDON_BIN: ${{ runner.temp }}/cordon-bin
        CORDON_REPORT_FILE: ${{ runner.temp }}/cordon-report.txt
      run: |
        # set +e: a composite run step otherwise aborts immediately (bash
        # -eo pipefail) the moment cordon-bin exits non-zero, which would
        # skip the step-summary write below whenever the wrapped command
        # itself fails — exactly the case where seeing the report matters
        # most.
        #
        # stderr goes straight to the report file, not through a
        # `2> >(tee ...)` process substitution: bash does not wait for a
        # process-substitution subshell before continuing to the next
        # line, so the `[ -s "$CORDON_REPORT_FILE" ]` check below could
        # run before tee had finished flushing, silently skipping the
        # step-summary write on a fast run (DECISIONS.md 2026-09-14, the
        # race entry). A plain redirect is synchronous, so the file is
        # complete before this line returns; `cat` afterward puts the
        # same content back on stderr for the live log.
        set +e
        "$CORDON_BIN" run sh -c "$CORDON_RUN_CMD" 2>"$CORDON_REPORT_FILE"
        status=$?
        cat "$CORDON_REPORT_FILE" >&2

        echo "DEBUG cordon-action: GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" >&2
        echo "DEBUG cordon-action: CORDON_REPORT_FILE size=$(wc -c < "$CORDON_REPORT_FILE" 2>&1)" >&2
        if [ -s "$CORDON_REPORT_FILE" ]; then
          echo "DEBUG cordon-action: entering summary-write branch" >&2
          {
            echo '## Cordon behavior report'
            echo
            echo '```'
            cat "$CORDON_REPORT_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DEBUG cordon-action: after write, summary size=$(wc -c < "$GITHUB_STEP_SUMMARY" 2>&1)" >&2
        else
          echo "DEBUG cordon-action: skipped summary-write branch, report file was empty" >&2
        fi

        # The Action's own exit code is exactly the wrapped command's exit
        # code — INTENT.md §5: "Blocking installs by default. Cordon
        # reports; the human decides." A HIGH finding never fails this
        # step by itself (features/github-action/intent.md).
        exit $status
